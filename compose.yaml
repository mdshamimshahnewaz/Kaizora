# Local development only. The application runs on the host.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kaizora
      POSTGRES_USER: kaizora
      POSTGRES_PASSWORD: kaizora_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizora -d kaizora"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
